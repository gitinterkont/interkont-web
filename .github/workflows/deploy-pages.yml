name: Deploy interkont.co to GitHub Pages

# Pipeline de produccion: sirve el sitio Astro (contenido de WordPress via
# WPGraphQL) en https://interkont.co. Se dispara en cada push a main, o via
# repository_dispatch (event_type: wordpress-published) cuando se publica
# contenido en WordPress -- ver elementor/wp-vercel-deploy-hook.php.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: https://interkont.co
        run: npm run build

      - name: Configura el dominio personalizado de Pages
        run: echo 'interkont.co' > dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-site/dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
